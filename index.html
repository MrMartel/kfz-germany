<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kfz-Kennzeichen Finder — Plaques Allemandes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .land-path {
            fill: #334155;
            stroke: #1e293b;
            stroke-width: 1.5;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .land-path:hover {
            fill: #3b82f6;
            stroke: #93c5fd;
            stroke-width: 2;
        }
        .land-path.active {
            fill: #2563eb;
            stroke: #60a5fa;
            stroke-width: 2.5;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-slate-100 antialiased">
    <div class="max-w-5xl mx-auto px-4 py-10">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Kfz-Kennzeichen Finder</h1>
            <p class="text-slate-400 text-sm">Encyclopédie interactive des préfixes d'immatriculation en Allemagne.</p>
            
            <!-- Plaque interactive d'accueil -->
            <div id="heroPlateContainer" class="mt-6 flex justify-center items-center">
                <div class="flex border-4 border-slate-700 rounded-2xl overflow-hidden bg-white shadow-2xl w-72 h-20 items-center transition-all">
                    <div class="bg-blue-700 text-white w-12 h-full flex flex-col items-center justify-between py-2 shadow-inner shrink-0">
                        <svg class="w-5 h-5 text-amber-300" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"/>
                        </svg>
                        <span class="text-sm font-black tracking-widest">D</span>
                    </div>
                    <div id="heroPlateText" class="flex-1 flex items-center justify-center font-black tracking-widest text-4xl text-slate-900 px-2">
                        D
                    </div>
                </div>
            </div>
        </header>

        <!-- Barre de recherche -->
        <div class="max-w-2xl mx-auto mb-6">
            <input type="text" id="searchInput" placeholder="Rechercher par préfixe ou par ville..." class="w-full pl-4 pr-4 py-3.5 rounded-2xl bg-slate-800 text-white border border-slate-700 mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                <input type="checkbox" id="exactMatchCheckbox" checked class="w-4 h-4 text-blue-600 rounded">
                <span>Préfixe exact uniquement</span>
            </label>
        </div>

        <!-- Section Carte + Filtres -->
        <div class="bg-slate-800/60 rounded-2xl border border-slate-700/80 p-6 mb-8 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                
                <!-- Conteneur CARTE SVG -->
                <div class="md:col-span-1 flex flex-col items-center justify-center bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 min-h-[300px]">
                    <div id="mapWrapper" class="w-full max-w-[210px] flex items-center justify-center">
                        <span class="text-xs text-slate-500">Chargement de la carte...</span>
                    </div>
                    <span id="mapHoverLabel" class="text-[11px] font-medium text-slate-400 mt-2 h-4 text-center">Toutes les régions</span>
                </div>

                <!-- Filtres boutons -->
                <div class="md:col-span-2">
                    <div id="statesFilterContainer" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>

        <!-- Grille de résultats -->
        <div class="flex justify-between items-center mb-4 px-1">
            <span id="resultCount" class="text-xs font-semibold text-slate-400">0 résultat(s) affiché(s)</span>
        </div>
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
