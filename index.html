<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kfz-Kennzeichen Finder — Plaques Allemandes</title>
    <!-- Inclusion d'un favicon personnalisé (Drapeau allemand / Icône de plaque) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H5V9h14v9z'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-slate-100 antialiased">
    <div class="max-w-5xl mx-auto px-4 py-12">
        
        <!-- En-tête accueillant avec logo stylisé -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/20 border border-blue-500/30 text-blue-400 mb-4 shadow-inner shadow-blue-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-3">Kfz-Kennzeichen Finder</h1>
            <p class="text-slate-400 max-w-lg mx-auto text-sm sm:text-base">
                Encyclopédie interactive des préfixes d'immatriculation automobile en Allemagne. Recherchez par ville, région ou Land.
            </p>
        </header>

        <!-- Barre de recherche moderne -->
        <div class="relative mb-8 max-w-2xl mx-auto">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Rechercher un préfixe (ex: M, B, K) ou une ville..." 
                class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-400 shadow-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-base">
        </div>

        <!-- Filtres par Land -->
        <div class="bg-slate-800/50 backdrop-blur-md rounded-2xl border border-slate-700/60 p-5 mb-8 shadow-lg">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Filtrer par Land :</h2>
                <span id="resultCount" class="text-xs text-blue-400 font-medium"></span>
            </div>
            <div id="statesFilterContainer" class="flex flex-wrap gap-2">
                <!-- Boutons injectés par JS -->
            </div>
        </div>

        <!-- Grille des résultats -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Injecté dynamiquement par JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
