<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kfz-Kennzeichen Finder</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <!-- Framework Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center relative">

    <!-- Infobulle flottante pour la carte SVG -->
    <div id="mapTooltip" class="fixed pointer-events-none z-50 hidden bg-slate-900/95 border border-slate-700 text-white text-xs px-3 py-2 rounded-xl shadow-2xl backdrop-blur-md transition-opacity duration-150 transform -translate-x-1/2 -translate-y-full mb-2">
        <p id="tooltipStateName" class="font-bold text-blue-400"></p>
        <p id="tooltipPlateCount" class="text-[11px] text-slate-300"></p>
    </div>

    <!-- En-tête avec image d'accueil fixe et badge de version -->
    <header class="text-center mb-8 max-w-xl w-full flex flex-col items-center">
        <img src="image_accueil.png" alt="Plaque d'immatriculation allemande RA KL 8136" class="max-w-[400px] w-[90%] h-auto block mx-auto mb-4 rounded-lg shadow-2xl">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Kfz-Kennzeichen Finder</h1>
        
        <!-- Pastille de version V3 -->
        <div class="mt-2 mb-1 inline-flex items-center gap-1.5 px-3 py-1 bg-blue-500/10 border border-blue-500/30 rounded-full">
            <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
            <span class="text-xs font-mono font-semibold text-blue-300 tracking-wider">v3.0.0-dev</span>
        </div>

        <p class="text-slate-400 text-sm md:text-base mt-1">Encyclopédie interactive des préfixes d'immatriculation en Allemagne.</p>
    </header>

    <main class="w-full max-w-5xl flex flex-col gap-6">
        
        <!-- Zone de recherche -->
        <section class="flex flex-col items-center gap-3">
            <div class="w-full max-w-md">
                <input type="text" id="searchInput" placeholder="Rechercher par préfixe ou par ville..." 
                       class="w-full px-5 py-3 bg-slate-800/90 border border-slate-700 rounded-full text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all shadow-inner">
            </div>
            <label class="flex items-center gap-2 text-slate-400 text-xs md:text-sm cursor-pointer hover:text-slate-200 transition-colors" for="exactMatchCheckbox">
                <input type="checkbox" id="exactMatchCheckbox" checked class="accent-blue-600 w-4 h-4 rounded cursor-pointer">
                Préfixe exact uniquement
            </label>
        </section>

        <!-- Tableau de bord : Carte, Filtres & Armoirie dynamique -->
        <section class="bg-slate-800/50 backdrop-blur-md border border-slate-700/60 rounded-3xl p-5 md:p-6 flex flex-col md:flex-row gap-6 items-stretch shadow-xl">
            
            <!-- Conteneur Carte SVG -->
            <div class="flex-shrink-0 bg-slate-900/80 border border-slate-700/50 rounded-2xl p-4 flex flex-col items-center justify-between min-w-[260px]">
                <div id="svgContainer" class="w-full flex justify-center items-center"></div>
                <span id="mapHoverLabel" class="text-xs font-medium text-slate-400 mt-3">Toutes les régions</span>
            </div>

            <!-- Colonne Droite : Filtres + Grand affichage de l'armoirie -->
            <div class="flex-1 flex flex-col justify-between gap-6">
                <!-- Filtres générés par script.js -->
                <div class="flex flex-wrap content-start gap-2" id="statesFilterContainer"></div>

                <!-- Zone d'affichage de l'armoirie sélectionnée -->
                <div class="bg-slate-900/60 border border-slate-700/40 rounded-2xl p-6 flex flex-col items-center justify-center min-h-[160px] transition-all">
                    <img id="stateCoatOfArmsDisplay" class="h-24 w-auto object-contain drop-shadow-xl transition-all duration-300" src="https://upload.wikimedia.org/wikipedia/commons/d/da/Coat_of_arms_of_Germany.svg" alt="Armoiries du Land sélectionné">
                    <span id="stateCoatOfArmsTitle" class="text-xs font-bold text-slate-300 mt-3 tracking-wide">République fédérale d'Allemagne</span>
                </div>
            </div>
        </section>

        <!-- Grille des résultats -->
        <section>
            <div id="resultCount" class="text-xs font-semibold text-slate-400 mb-3 px-1"></div>
            <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <!-- Modale de détail -->
    <div id="plateModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modalContent" class="bg-slate-900 border border-slate-700/80 rounded-3xl max-w-lg w-full p-6 md:p-8 relative shadow-2xl transform transition-all scale-95 opacity-0">
            <button onclick="closePlateModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-9 h-9 rounded-full flex items-center justify-center transition-colors">
                ✕
            </button>
            
            <div class="flex border-4 border-slate-700 rounded-2xl overflow-hidden bg-white shadow-2xl w-full h-28 items-center mb-6">
                <div class="bg-blue-700 text-white w-14 h-full flex flex-col items-center justify-between py-3 shadow-inner">
                    <svg class="w-6 h-6 text-amber-300" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"/>
                    </svg>
                    <span class="text-xs font-black tracking-widest">D</span>
                </div>
                <div id="modalPrefix" class="flex-1 flex items-center justify-center font-black tracking-widest text-5xl md:text-6xl text-slate-900">
                    --
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Ville / Zone administrative</span>
                    <h2 id="modalCity" class="text-2xl font-extrabold text-white mt-0.5"></h2>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Land (État)</span>
                        <div class="flex items-center gap-2 mt-1">
                            <img id="modalCoatOfArms" class="h-8 w-auto object-contain hidden drop-shadow" alt="Armoiries du Land">
                            <p id="modalState" class="text-base font-bold text-blue-400"></p>
                        </div>
                    </div>
                    <div>
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Code Land</span>
                        <p id="modalLandId" class="text-base font-semibold text-slate-300 font-mono mt-1"></p>
                    </div>
                </div>
                <div>
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Arrondissement / Description</span>
                    <p id="modalRegion" class="text-sm text-slate-300 leading-relaxed mt-0.5"></p>
                </div>
            </div>
            
            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-end">
                <button id="modalFilterBtn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition-all shadow-md shadow-blue-600/30">
                    Filtrer par ce Land
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
